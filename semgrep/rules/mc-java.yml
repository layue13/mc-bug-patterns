- id: mc-d1-menu-always-valid
  languages:
  - java
  severity: WARNING
  message: Menu/Container 的 stillValid / canInteractWith 恒为 true。方块被拆/被传送/物品被移走后界面仍可操作， 是"A 开着界面、B 改动实体、A
    还能取物"类复制的前提 (范式 D1)。
  metadata:
    pattern: D1
    confidence: MEDIUM
    cases:
    - 99
    - 101
    - 120
    - 143
    - 144
    - 145
    - 171
  pattern-either:
  - pattern: |
      public boolean stillValid(Player $P) { return true; }
  - pattern: |
      public boolean canInteractWith(EntityPlayer $P) { return true; }
- id: mc-d1-item-backed-menu-saves-on-close-only
  languages:
  - java
  severity: INFO
  message: 以物品(背包/手袋/饰品盒)为后端的容器只在 removed()/onContainerClosed() 写回。玩家在不关界面时 下线、换槽、丢物品会导致写回丢失或写到别的物品上 (范式
    D1)。请确认槽位变化即时落盘且校验物品身份。
  metadata:
    pattern: D1
    confidence: LOW
    cases:
    - 121
    - 122
    - 123
    - 56
  pattern-either:
  - pattern: |
      public void removed(Player $P) { ... $X.getOrCreateTag(...); ... }
  - pattern: |
      public void onContainerClosed(EntityPlayer $P) { ... $X.setTagCompound(...); ... }
  - pattern: |
      public void onContainerClosed(EntityPlayer $P) { ... $X.writeToNBT(...); ... }
- id: mc-d2-manual-quickmove
  languages:
  - java
  severity: INFO
  message: quickMoveStack / transferStackInSlot 内手写 set/put，而不是 moveItemStackTo/mergeItemStack。 硬编码槽位区间与玩家背包重叠时
    Shift 点击会翻倍 (范式 D2)。
  metadata:
    pattern: D2
    confidence: LOW
    cases:
    - 173
    - 174
    - 5
    - 7
  patterns:
  - pattern-either:
    - pattern: |
        public ItemStack quickMoveStack(Player $P, int $I) { ... }
    - pattern: |
        public ItemStack transferStackInSlot(EntityPlayer $P, int $I) { ... }
  - pattern-either:
    - pattern: |
        $RT1 $M1(...) { ... $S1.set($V1); ... }
    - pattern: |
        $RT1 $M1(...) { ... $S1.putStack($V1); ... }
    - pattern: |
        $RT1 $M1(...) { ... $C1.setItem($N1, $V1); ... }
  - pattern-not: |
      $RT2 $M2(...) {
        ...
        if (<... moveItemStackTo(...) ...>) { ... }
        ...
      }
  - pattern-not: |
      $RT2 $M2(...) {
        ...
        if (<... mergeItemStack(...) ...>) { ... }
        ...
      }
  - pattern-not: |
      $RT2 $M2(...) {
        ...
        if (<... $Z.moveItemStackTo(...) ...>) { ... }
        ...
      }
  - pattern-not: |
      $RT2 $M2(...) {
        ...
        if (<... $Z.mergeItemStack(...) ...>) { ... }
        ...
      }
- id: mc-d4-inventory-item-stackable
  languages:
  - java
  severity: INFO
  message: Item 子类会打开带库存的界面(openScreen/openGui)，但类中没有 stacksTo(1)/setMaxStackSize(1)/getItemStackLimit。
    若注册处也没限制，叠加的多个背包共享同一份库存 NBT，放入物品后"每个背包都有"(范式 D4)。
  metadata:
    pattern: D4
    confidence: LOW
    cases:
    - 98
    - 61
    - 56
  patterns:
  - pattern-either:
    - pattern: NetworkHooks.openScreen(...)
    - pattern: $P.openGui(...)
    - pattern: NetworkHooks.openGui(...)
  - pattern-inside: |
      class $C extends Item { ... }
  - pattern-not-inside: |
      class $C extends Item { ... public $C(...) { super(<... $P.stacksTo(1) ...>); } ... }
  - pattern-not-inside: |
      class $C extends Item {
        ...
        public int getItemStackLimit(...) { ... }
        ...
      }
  - pattern-not-inside: |
      class $C extends Item {
        ...
        public int getMaxStackSize(...) { ... }
        ...
      }
- id: mc-d4-entity-save-to-item
  languages:
  - java
  severity: INFO
  message: 将实体序列化进物品(灵魂瓶/生物球类)。需要同时处理：携带的容器 NBT(驴/骡/箱子)、BOSS 黑名单、 刷怪箱重复生成时清空 Slot (范式 D4/G3)。
  metadata:
    pattern: D4
    confidence: LOW
    cases:
    - 73
    - 104
    - 106
  patterns:
  - pattern-either:
    - pattern: $E.saveWithoutId(...)
    - pattern: $E.save($TAG)
    - pattern: $E.writeToNBT($TAG)
  - pattern-inside: |
      $RET $F(..., LivingEntity $E, ...) { ... }
  - pattern-not-inside: |
      $RET $F(...) {
        ...
        if (<... $X.isBoss(...) ...>) { ... }
        ...
      }
  - pattern-not-inside: |
      $RET $F(...) {
        ...
        if (<... isBoss(...) ...>) { ... }
        ...
      }
- id: mc-g1-world-edit-without-protection-check
  languages:
  - java
  severity: WARNING
  message: Item/Block/BlockEntity 方法直接改世界方块，但同一方法内没有任何保护检查 (mayInteract / mayUseItemAt / BlockEvent.BreakEvent
    / canPlayerEdit / canHarvestBlock)。领地/保护插件通常挂在事件上，直接 setBlock/destroyBlock 会绕过它们 (范式 G1)。 对自身位置(worldPosition/getBlockPos)的修改视为方块实体维护自身状态，不报。
  metadata:
    pattern: G1
    confidence: MEDIUM
    cases:
    - 115
    - 131
    - 132
    - 133
    - 157
    - 164
    - 167
    - 168
    - 169
    - 170
  patterns:
  - pattern-either:
    - pattern: $W.destroyBlock(...)
    - pattern: $W.removeBlock(...)
    - pattern: $W.setBlock(...)
    - pattern: $W.setBlockState(...)
    - pattern: $W.setBlockAndUpdate(...)
    - pattern: $W.setBlockToAir(...)
  - pattern-inside: |
      class $C extends $PARENT { ... }
  - pattern-not: $W.destroyBlock(worldPosition, ...)
  - pattern-not: $W.destroyBlock(this.worldPosition, ...)
  - pattern-not: $W.destroyBlock(getBlockPos(), ...)
  - pattern-not: $W.destroyBlock(this.getBlockPos(), ...)
  - pattern-not: $W.destroyBlock(this.pos, ...)
  - pattern-not: $W.removeBlock(worldPosition, ...)
  - pattern-not: $W.removeBlock(this.worldPosition, ...)
  - pattern-not: $W.removeBlock(getBlockPos(), ...)
  - pattern-not: $W.removeBlock(this.getBlockPos(), ...)
  - pattern-not: $W.removeBlock(this.pos, ...)
  - pattern-not: $W.setBlock(worldPosition, ...)
  - pattern-not: $W.setBlock(this.worldPosition, ...)
  - pattern-not: $W.setBlock(getBlockPos(), ...)
  - pattern-not: $W.setBlock(this.getBlockPos(), ...)
  - pattern-not: $W.setBlock(this.pos, ...)
  - pattern-not: $W.setBlockState(worldPosition, ...)
  - pattern-not: $W.setBlockState(this.worldPosition, ...)
  - pattern-not: $W.setBlockState(getBlockPos(), ...)
  - pattern-not: $W.setBlockState(this.getBlockPos(), ...)
  - pattern-not: $W.setBlockState(this.pos, ...)
  - pattern-not: $W.setBlockAndUpdate(worldPosition, ...)
  - pattern-not: $W.setBlockAndUpdate(this.worldPosition, ...)
  - pattern-not: $W.setBlockAndUpdate(getBlockPos(), ...)
  - pattern-not: $W.setBlockAndUpdate(this.getBlockPos(), ...)
  - pattern-not: $W.setBlockAndUpdate(this.pos, ...)
  - pattern-not: $W.setBlockToAir(worldPosition, ...)
  - pattern-not: $W.setBlockToAir(this.worldPosition, ...)
  - pattern-not: $W.setBlockToAir(getBlockPos(), ...)
  - pattern-not: $W.setBlockToAir(this.getBlockPos(), ...)
  - pattern-not: $W.setBlockToAir(this.pos, ...)
  - metavariable-regex:
      metavariable: $PARENT
      regex: .*(Item|Block|Wand|Tool|Pickaxe|Entity|Tile).*
  - pattern-not-inside: |
      if ($X.isClientSide) { ... }
  - pattern-not-inside: |
      if ($X.isClientSide()) { ... }
  - pattern-not-inside: |
      $RET $F(...) {
        ...
        if (<... $X.mayInteract(...) ...>) { ... }
        ...
      }
  - pattern-not-inside: |
      $RET $F(...) {
        ...
        if (<... $X.mayUseItemAt(...) ...>) { ... }
        ...
      }
  - pattern-not-inside: |
      $RET $F(...) {
        ...
        if (<... $X.canPlayerEdit(...) ...>) { ... }
        ...
      }
  - pattern-not-inside: |
      $RET $F(...) {
        ...
        if (<... new $T.BreakEvent(...) ...>) { ... }
        ...
      }
  - pattern-not-inside: |
      $RET $F(...) {
        ...
        if (<... new BreakEvent(...) ...>) { ... }
        ...
      }
  - pattern-not-inside: |
      $RET $F(...) {
        ...
        if (<... $X.onBlockBreakEvent(...) ...>) { ... }
        ...
      }
  - pattern-not-inside: |
      $RET $F(...) {
        ...
        if (<... $X.post(...) ...>) { ... }
        ...
      }
  - pattern-not-inside:
      patterns:
      - pattern: |
          $RET $F(...) {
            ...
            if (<... $G(...) ...>) { ... }
            ...
          }
      - metavariable-regex:
          metavariable: $G
          regex: (?i)^(can|may|is|has|check|verify|allow|permit|test|try)\w*(place|replace|break|edit|interact|build|permission|allowed|claim|protect)\w*$
  - pattern-not-inside:
      patterns:
      - pattern: |
          $RET $F(...) {
            ...
            if (<... $X.$G(...) ...>) { ... }
            ...
          }
      - metavariable-regex:
          metavariable: $G
          regex: (?i)^(can|may|is|has|check|verify|allow|permit|test|try)\w*(place|replace|break|edit|interact|build|permission|allowed|claim|protect)\w*$
- id: mc-g1-unbounded-explosion-power
  languages:
  - java
  severity: WARNING
  message: explode()/createExplosion() 的威力由非常量表达式决定且没有 min/clamp 上限。TNT 数量、火药数量、 能量等放大因子会让爆炸半径无限增长，造成无视领地大面积破坏或宕机
    (范式 G1/C1)。
  metadata:
    pattern: G1
    confidence: MEDIUM
    cases:
    - 125
    - 129
    - 151
    - 152
    - 126
  patterns:
  - pattern-either:
    - pattern: $W.explode($E, $X, $Y, $Z, $POWER, ...)
    - pattern: $W.createExplosion($E, $X, $Y, $Z, $POWER, ...)
  - metavariable-regex:
      metavariable: $POWER
      regex: ^(?![\d.]+[fFdDlL]?$)(?!.*(?:min|clamp|MAX|Math\.min|Mth\.clamp)).*[A-Za-z_].*$
