# Semgrep rules distilled from https://bug.mcmod.cn (MC百科「MOD特性警示」, 176 entries).
# metadata.pattern = paradigm id documented in ../../README.md; metadata.cases = ids in data/mcmod-bug-catalog.json.
# These are *leads for review*, not proofs: see metadata.confidence.
rules:
- id: mc-d3-handler-ignores-simulate
  languages:
  - java
  severity: WARNING
  message: IItemHandler.insertItem/extractItem 没有使用 `simulate` 参数。管道/漏斗/传送带会先 simulate 再执行，忽略它会导致"模拟成功、实际多给/少扣"，是自动化复制的根源
    (范式 D3)。
  metadata:
    pattern: D3
    confidence: HIGH
    cases:
    - 2
    - 60
    - 65
  pattern-either:
  - patterns:
    - pattern: |
        public ItemStack insertItem(int $SLOT, ItemStack $STACK, boolean $SIM) { ... }
    - pattern-not: |
        public ItemStack insertItem(int $SLOT, ItemStack $STACK, boolean $SIM) { ... if (<... $SIM ...>) { ... } ... }
    - pattern-not: |
        public ItemStack insertItem(int $SLOT, ItemStack $STACK, boolean $SIM) { ... return <... $SIM ...>; ... }
    - pattern-not: |
        public ItemStack insertItem(int $SLOT, ItemStack $STACK, boolean $SIM) { ... $V = <... $SIM ...>; ... }
    - pattern-not: |
        public ItemStack insertItem(int $SLOT, ItemStack $STACK, boolean $SIM) { ... $V $N = <... $SIM ...>; ... }
    - pattern-not: |
        public ItemStack insertItem(int $SLOT, ItemStack $STACK, boolean $SIM) { ... $X.$M(..., $SIM, ...); ... }
  - patterns:
    - pattern: |
        public ItemStack extractItem(int $SLOT, int $AMT, boolean $SIM) { ... }
    - pattern-not: |
        public ItemStack extractItem(int $SLOT, int $AMT, boolean $SIM) { ... if (<... $SIM ...>) { ... } ... }
    - pattern-not: |
        public ItemStack extractItem(int $SLOT, int $AMT, boolean $SIM) { ... return <... $SIM ...>; ... }
    - pattern-not: |
        public ItemStack extractItem(int $SLOT, int $AMT, boolean $SIM) { ... $V = <... $SIM ...>; ... }
    - pattern-not: |
        public ItemStack extractItem(int $SLOT, int $AMT, boolean $SIM) { ... $V $N = <... $SIM ...>; ... }
    - pattern-not: |
        public ItemStack extractItem(int $SLOT, int $AMT, boolean $SIM) { ... $X.$M(..., $SIM, ...); ... }
